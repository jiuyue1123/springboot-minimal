server:
  shutdown: graceful

spring:
  application:
    name: web
  profiles:
    active: dev
  lifecycle:
    timeout-per-shutdown-phase: 60s
  jackson:
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
      key-prefix: "springboot-minimal::"
      use-key-prefix: true
      enable-statistics: true
  task:
    execution:
      pool:
        core-size: 8
        max-size: 32
        queue-capacity: 1000
      thread-name-prefix: async-
      shutdown:
        await-termination: true
        await-termination-period: 30s
    scheduling:
      pool:
        size: 4
      thread-name-prefix: scheduling-
      shutdown:
        await-termination: true
        await-termination-period: 30s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      id-type: assign_id

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  info:
    env:
      enabled: true

app:
  cors:
    enabled: true
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    exposed-headers: X-Trace-Id,X-Timestamp
    allow-credentials: true
    max-age: 3600

info:
  app:
    name: ${spring.application.name}
    version: @project.version@

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.example
  paths-to-match: /**
  default-produces-media-type: application/json

openapi:
  info:
    title: Spring Boot Minimal API
    description: Starter template API for Spring Boot services
